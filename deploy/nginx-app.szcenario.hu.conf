# app.szcenario.hu — ugyanaz a statikus origin, mint a szcenario.hu (port 5100).
# A régi /var/www/site-5 és a pm2 site-5 NEM szolgálhatja ezt a hostot.
server {
    listen 80;
    server_name app.szcenario.hu;
    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
