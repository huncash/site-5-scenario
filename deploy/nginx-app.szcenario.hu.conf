# app.szcenario.hu — zárt. A 5100-as origin nginx auth mögött.
# Site-1..4 / :3000-:3003 TILOS. SOHA default_server.
server {
    listen 80;
    server_name app.szcenario.hu;
    location / {
        auth_basic "Szcenárió";
        auth_basic_user_file /etc/nginx/htpasswd-szcenario;
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/snippets/szcenario.proxy-params.inc;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
