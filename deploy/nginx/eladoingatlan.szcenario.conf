## /etc/nginx/sites-available/eladoingatlan.szcenario
## Public listing — separate Next.js process on :5140 (not static-origin :5100).

server {
    listen 80;
    listen [::]:80;
    server_name eladoingatlan.szcenario.hu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eladoingatlan.szcenario.hu;

    # Certbot dedikált cert (ha van), különben a wildcard/apex szcenario.hu.
    ssl_certificate     /etc/letsencrypt/live/eladoingatlan.szcenario.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eladoingatlan.szcenario.hu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 5M;

    location ~ /\.(ht|git|env) { deny all; }

    location / {
        proxy_pass http://127.0.0.1:5140;
        include /etc/nginx/snippets/szcenario.proxy-params.inc;
    }
}
