## /etc/nginx/sites-available/szcenario.subdomains
## Named aldomainek → 127.0.0.1:5100 (Host alapján static-origin site root).
## bill.szcenario.hu a 5100-as static-origin Host → sites/bill tesztoldal.
## Cert: certbot … -d support.szcenario.hu -d docs.szcenario.hu -d blog.szcenario.hu -d app.szcenario.hu -d school.szcenario.hu
## SOHA ne tegyél bele default_server jelzőt.

# HTTP → HTTPS + ACME
server {
    listen 80;
    listen [::]:80;
    server_name support.szcenario.hu docs.szcenario.hu blog.szcenario.hu app.szcenario.hu school.szcenario.hu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS named aldomainek → 5100
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name support.szcenario.hu docs.szcenario.hu blog.szcenario.hu app.szcenario.hu school.szcenario.hu;

    ssl_certificate     /etc/letsencrypt/live/szcenario.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szcenario.hu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;

    location ~ /\.(ht|git|env) { deny all; }

    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
