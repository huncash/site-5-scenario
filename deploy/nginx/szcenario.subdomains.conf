## /etc/nginx/sites-available/szcenario.subdomains
## Named aldomainek zártak (basic auth). Site-1..4 / :3000-:3003 TILOS.
## SOHA ne tegyél bele default_server jelzőt.

server {
    listen 80;
    listen [::]:80;
    server_name support.szcenario.hu docs.szcenario.hu blog.szcenario.hu app.szcenario.hu school.szcenario.hu signal.szcenario.hu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name support.szcenario.hu docs.szcenario.hu blog.szcenario.hu app.szcenario.hu school.szcenario.hu signal.szcenario.hu;

    ssl_certificate     /etc/letsencrypt/live/szcenario.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szcenario.hu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;
    auth_basic "Szcenárió";
    auth_basic_user_file /etc/nginx/htpasswd-szcenario;

    location ~ /\.(ht|git|env) { deny all; }

    location / {
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/snippets/szcenario.proxy-params.inc;
    }
}
