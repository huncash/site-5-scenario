## /etc/nginx/sites-available/szcenario.hu
## ELSŐ LÉPÉS — csak HTTP, amíg nincs Let's Encrypt cert.
## SOHA ne tegyél bele default_server jelzőt.

server {
    listen 195.228.152.141:80;
    listen [2001:4c48:2:a348:88e7:9ff:fefd:3931]:80;
    listen 80;
    listen [::]:80;
    server_name szcenario.hu www.szcenario.hu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 200 "szcenario.hu DNS + nginx OK — cert következik\n";
        add_header Content-Type text/plain;
    }
}
