## /etc/nginx/sites-available/szcenario.hu
## ELSŐ LÉPÉS / port-szétválasztás (HTTP).
## Exact match (bill.*) megelőzi a wildcardot (*.szcenario.hu).
## SOHA ne tegyél bele default_server jelzőt — az offlinebiztonsag.hu fallback elkerülése.

# 1. BILL → 5100 (sites/bill tesztoldal, Host header)
server {
    listen 80;
    listen [::]:80;
    server_name bill.szcenario.hu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. FŐOLDAL + minden más aldomain → 5100
server {
    listen 80;
    listen [::]:80;
    server_name szcenario.hu www.szcenario.hu *.szcenario.hu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
