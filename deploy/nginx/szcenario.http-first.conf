## /etc/nginx/sites-available/szcenario.hu
## HTTP (cert előtt). Nyilvános csak az apex `/`. Site-1..4 / :3000-:3003 TILOS.
## SOHA ne tegyél bele default_server jelzőt.

# BILL — zárt
server {
    listen 80;
    listen [::]:80;
    server_name bill.szcenario.hu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location ^~ /api {
        auth_basic "Szcenárió";
        auth_basic_user_file /etc/nginx/htpasswd-szcenario;
        proxy_pass http://127.0.0.1:5110;
        include /etc/nginx/snippets/szcenario.proxy-params.inc;
    }

    location / {
        auth_basic "Szcenárió";
        auth_basic_user_file /etc/nginx/htpasswd-szcenario;
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/snippets/szcenario.proxy-params.inc;
    }
}

# FŐOLDAL: nyilvános csak /
server {
    listen 80;
    listen [::]:80;
    server_name szcenario.hu www.szcenario.hu *.szcenario.hu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /favicon.ico {
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/snippets/szcenario.proxy-params.inc;
    }

    location = / {
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/snippets/szcenario.proxy-params.inc;
    }

    location / {
        auth_basic "Szcenárió";
        auth_basic_user_file /etc/nginx/htpasswd-szcenario;
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/snippets/szcenario.proxy-params.inc;
    }
}
