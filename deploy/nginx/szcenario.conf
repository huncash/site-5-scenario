## /etc/nginx/sites-available/szcenario.hu
## Ideiglenes nyilvános főoldal: csak `location = /` → 127.0.0.1:5100 (Fejlesztés alatt).
## Minden más útvonal és aldomain: HTTP basic auth → eredeti 5100/5110.
## SOHA ne tegyél bele default_server-t. Site-1..4 / :3000-:3003 TILOS.

# HTTP → HTTPS + ACME (bill)
server {
    listen 80;
    listen [::]:80;
    server_name bill.szcenario.hu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP → HTTPS + ACME (apex + wildcard)
server {
    listen 80;
    listen [::]:80;
    server_name szcenario.hu www.szcenario.hu *.szcenario.hu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.szcenario.hu;

    ssl_certificate     /etc/letsencrypt/live/szcenario.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szcenario.hu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://szcenario.hu$request_uri;
}

# BILL HTTPS — zárt
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bill.szcenario.hu;

    ssl_certificate     /etc/letsencrypt/live/szcenario.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szcenario.hu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;
    auth_basic "Szcenárió";
    auth_basic_user_file /etc/nginx/htpasswd-szcenario;

    location ~ /\.(ht|git|env) { deny all; }

    location ^~ /api {
        proxy_pass http://127.0.0.1:5110;
        include /etc/nginx/snippets/szcenario.proxy-params.inc;
    }

    location / {
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/snippets/szcenario.proxy-params.inc;
    }
}

# Apex HTTPS — nyilvános csak a /
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name szcenario.hu;

    ssl_certificate     /etc/letsencrypt/live/szcenario.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szcenario.hu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript image/svg+xml;

    auth_basic_user_file /etc/nginx/htpasswd-szcenario;

    location ~ /\.(ht|git|env) { deny all; }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /favicon.ico {
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/snippets/szcenario.proxy-params.inc;
    }

    location = / {
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/snippets/szcenario.proxy-params.inc;
    }

    location / {
        auth_basic "Szcenárió";
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/snippets/szcenario.proxy-params.inc;
    }
}

# support / docs / blog / app / school / signal / egyéb — zárt
