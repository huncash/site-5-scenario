## /etc/nginx/sites-available/szcenario.hu
## KANONIKUS — a VPS-en az élő config EZZEL egyezzen.
## nginx (443) → Node/PM2 127.0.0.1:4100
## Közös VPS: 4100=szcenario.hu
## SOHA ne tegyél bele default_server jelzőt.

# HTTP → HTTPS + ACME
server {
    listen 80;
    listen [::]:80;
    server_name szcenario.hu www.szcenario.hu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://szcenario.hu$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.szcenario.hu;

    ssl_certificate     /etc/letsencrypt/live/szcenario.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szcenario.hu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://szcenario.hu$request_uri;
}

# HTTPS main
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name szcenario.hu;

    ssl_certificate     /etc/letsencrypt/live/szcenario.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szcenario.hu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript image/svg+xml;

    location ~ /\.(ht|git|env) { deny all; }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
