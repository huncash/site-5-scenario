<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Szcenárió · docs</title>
    <meta name="description" content="Szcenárió dokumentáció — előkészítés alatt." />
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        background: radial-gradient(1200px 600px at 18% -12%, #1a3d32, #071511 58%);
        color: #ecfdf5;
      }
      main { max-width: 36rem; padding: 2rem 1.25rem; }
      .eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: #6ee7b7; margin-bottom: 0.5rem; }
      h1 { font-size: 1.6rem; margin: 0 0 0.75rem; }
      p { color: #94a3b8; line-height: 1.55; margin: 0 0 1rem; }
      a { color: #6ee7b7; }
      .row { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; margin-top: 1.25rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">docs.szcenario.hu</div>
      <h1>Dokumentáció</h1>
      <p>Ez a docs aldomain váz. A részletes kézikönyv ide kerül; addig a support tudástár és a GYIK a forrás.</p>
      <div class="row">
        <a href="https://support.szcenario.hu/">Support</a>
        <a href="https://support.szcenario.hu/gyik">GYIK</a>
        <a href="https://szcenario.hu">Főoldal</a>
      </div>
    </main>
  </body>
</html>
