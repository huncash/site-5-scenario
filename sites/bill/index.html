<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Számlázás — bill.szcenario.hu</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; min-height: 100dvh;
        background: radial-gradient(900px 420px at 12% -8%, #16382c, #071511 58%);
        color: #ecfdf5; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      main { padding: 28px 20px 56px; }
      .badge { display: inline-block; margin-bottom: 14px; padding: 5px 12px; border-radius: 999px;
        background: #064e3b; border: 1px solid #34d399; color: #a7f3d0;
        font-size: 11px; font-weight: 750; letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 4vw, 2.4rem); color: #f0fdf4; }
      .lead { margin: 0 0 22px; max-width: 36rem; font-size: 15px; line-height: 1.5; color: #94a3b8; }
      .status { max-width: 40rem; margin-bottom: 18px; padding: 16px 18px; border-radius: 14px;
        border: 2px solid #34d399; background: #064e3b; }
      .ok { margin: 0; font-size: 16px; font-weight: 800; color: #bbf7d0; }
      .meta { margin: 8px 0 0; font-size: 13px; color: #a7f3d0; word-break: break-all; }
      .card { max-width: 40rem; padding: 18px 18px 16px; border-radius: 14px;
        border: 1px solid #16382c; background: #0d221b; }
      .row { display: grid; grid-template-columns: 7.5rem 1fr; gap: 10px; padding: 8px 0;
        border-bottom: 1px solid #16382c; font-size: 14px; }
      .row:last-of-type { border-bottom: none; }
      .k { color: #6ee7b7; font-weight: 650; }
      .v { color: #ecfdf5; font-weight: 600; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      .chip { padding: 4px 9px; border-radius: 999px; background: #071511;
        border: 1px solid #34d399; color: #d1fae5; font-size: 12px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main data-bill-test-surface="">
      <div class="badge">Billing · Checkout</div>
      <h1>Számlázási origin</h1>
      <p class="lead">Csomagrendelés és fizetési tölcsér belépője. Nem a főoldal, nem a support tudástár.</p>
      <section class="status" role="status">
        <p class="ok">SUCCESS: bill.szcenario.hu aktív — Billing &amp; Checkout Origin</p>
        <p class="meta">host=<span id="host">—</span> · path=<span id="path">—</span></p>
      </section>
      <section class="card" aria-label="Funnel paraméterek">
        <div class="row"><span class="k">tier</span><span class="v" id="tier">—</span></div>
        <div class="row"><span class="k">interval</span><span class="v" id="interval">—</span></div>
        <div class="row"><span class="k">lang</span><span class="v" id="lang">—</span></div>
        <div class="row"><span class="k">ref</span><span class="v" id="ref">—</span></div>
        <div class="chips" id="chips"></div>
      </section>
    </main>
    <script>
      var q = new URLSearchParams(location.search);
      document.getElementById("host").textContent = location.hostname;
      document.getElementById("path").textContent = location.pathname;
      document.getElementById("tier").textContent = q.get("tier") || "—";
      document.getElementById("interval").textContent = q.get("interval") || "monthly";
      document.getElementById("lang").textContent = q.get("lang") || q.get("locale") || "—";
      document.getElementById("ref").textContent = q.get("ref") || q.get("referral") || "—";
      var chips = document.getElementById("chips");
      var pairs = Array.from(q.entries());
      chips.innerHTML = pairs.length
        ? pairs.map(function (p) { return '<span class="chip">' + p[0] + "=" + p[1] + "</span>"; }).join("")
        : '<p class="meta" style="color:#94a3b8">Nincs query — a tölcsér ?tier=&amp;interval=&amp;lang= ide érkezik.</p>';
    </script>
  </body>
</html>
