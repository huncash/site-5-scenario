<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Szcenárió — fizetés</title>
    <meta name="description" content="Billing · Checkout Origin — csomagrendelés, Számlázz.hu, Barion." />
    <script src="../src/lib/viewPrefsBoot.js"></script>
    <script>
      window["bp"] = window["bp"] || function () {
        (window["bp"].q = window["bp"].q || []).push(arguments);
      };
      window["bp"].l = 1 * new Date();
      var scriptElement = document.createElement("script");
      var firstScript = document.getElementsByTagName("script")[0];
      scriptElement.async = true;
      scriptElement.src = "https://pixel.barion.com/bp.js";
      firstScript.parentNode.insertBefore(scriptElement, firstScript);
      window["barion_pixel_id"] = "__BARION_PIXEL_ID__";
      if (/^BP-/.test(window["barion_pixel_id"])) {
        bp("init", "addBarionPixelId", window["barion_pixel_id"]);
      }
    </script>
    <noscript>
      <img height="1" width="1" style="display:none" alt="Barion Pixel" src="https://pixel.barion.com/a.gif?ba_pixel_id=__BARION_PIXEL_ID__&ev=contentView&noscript=1">
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
