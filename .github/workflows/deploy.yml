name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Node target, port 5100)
        env:
          NODE_ENV: production
          PORT: 5100
          NITRO_PORT: 5100
        run: npm run build:node

      - name: Verify CI production output
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -d .output/public
          mkdir -p .output/public
          echo "${{ github.sha }}" > .output/public/build-id.txt
          echo "${{ github.sha }}" > BUILD_SHA
          printf '{"sha":"%s","builtAt":"%s"}\n' "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .output/public/version.json
          test -f .output/public/sw.js
          test -f .output/public/manifest.webmanifest
          test -f .output/public/manifest.json
          test -f .output/public/index.html
          test -f .output/public/_shell.html
          test -f .output/public/sites/support/index.html
          test -f .output/public/sites/docs/index.html
          test -f .output/public/sites/blog/index.html
          test -f .output/public/sites/bill/index.html
          grep -q "Billing · Checkout" .output/public/sites/bill/index.html
          grep -q "Checkout Origin" .output/public/sites/bill/index.html
          grep -q "Szcenárió — fizetés" .output/public/sites/bill/index.html
          test -f scripts/static-origin.mjs
          test -f scripts/site-hosts.mjs
          test -f scripts/bill-api-path.mjs
          test -f .output/bill-server.mjs
          echo "Built SHA ${{ github.sha }}"
          find .output/public -maxdepth 3 -type f | sort

      - name: Package release
        run: |
          set -euo pipefail
          test -f ecosystem.config.cjs
          test -f scripts/static-origin.mjs
          test -f scripts/bill-api-path.mjs
          test -f scripts/vps-activate.sh
          test -f package.json
          test -f BUILD_SHA
          test -d eladoingatlan
          test -f eladoingatlan/package.json
          rm -rf release release.tar.gz
          mkdir -p release/scripts release/eladoingatlan
          cp -a .output release/.output
          cp -a package.json package-lock.json ecosystem.config.cjs BUILD_SHA release/
          # Ne vigyünk node_modules/.next-et a release-be (stale cache / méret)
          rsync -a --exclude node_modules --exclude .next --exclude '*.tgz' eladoingatlan/ release/eladoingatlan/
          cp -a scripts/static-origin.mjs scripts/site-hosts.mjs scripts/bill-api-path.mjs scripts/publicHomeGate.mjs scripts/vps-activate.sh release/scripts/
          tar -czf release.tar.gz -C release .
          tar -tzf release.tar.gz | grep -E '^\./ecosystem\.config\.cjs$|^ecosystem\.config\.cjs$'
          tar -tzf release.tar.gz | grep -E 'scripts/vps-activate\.sh'
          tar -tzf release.tar.gz | grep -E 'eladoingatlan/package\.json'
          tar -tzf release.tar.gz | grep -E '\.output/server/index\.mjs|BUILD_SHA|build-id\.txt|scripts/static-origin\.mjs|scripts/site-hosts\.mjs|scripts/bill-api-path\.mjs|scripts/publicHomeGate\.mjs|\.output/bill-server\.mjs'
          tar -tzf release.tar.gz | grep -E 'sites/support/index\.html|sites/docs/index\.html|sites/blog/index\.html|sites/bill/index\.html'
          ls -lh release.tar.gz

      - name: Validate VPS SSH key secret
        run: |
          test -n "${{ secrets.VPS_SSH_KEY }}" || (echo "Missing VPS_SSH_KEY secret" && exit 1)

      - name: Upload release to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 195.228.152.141
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "release.tar.gz"
          target: "/var/www/szcenario/incoming/"
          overwrite: true
          timeout: 120s

      - name: Activate release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 195.228.152.141
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: false
          command_timeout: 10m
          script: |
            set -euo pipefail
            SITE_SLUG=szcenario
            APP_DIR=/var/www/szcenario
            SHA=${{ github.sha }}
            RELEASE_DIR="$APP_DIR/releases/$SHA"
            mkdir -p "$APP_DIR/incoming" "$APP_DIR/releases" "$APP_DIR/shared"
            TAR="$(find "$APP_DIR/incoming" -name 'release.tar.gz' -type f | sort | tail -n 1)"
            test -n "$TAR"
            echo "tar=$TAR"
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"
            tar -xzf "$TAR" -C "$RELEASE_DIR"
            rm -f "$TAR"
            test -f "$RELEASE_DIR/scripts/vps-activate.sh"
            chmod +x "$RELEASE_DIR/scripts/vps-activate.sh"
            SITE_SLUG="$SITE_SLUG" APP_DIR="$APP_DIR" bash "$RELEASE_DIR/scripts/vps-activate.sh" "$SHA"

      - name: Deploy eladoingatlan subdomain
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 195.228.152.141
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 12m
          script: |
            set -euo pipefail
            export HOME=/home/deploy
            APP_DIR=/var/www/szcenario
            SHA=${{ github.sha }}
            RELEASE_DIR="$APP_DIR/releases/$SHA"
            SUB_DIR=/var/www/eladoingatlan

            echo "elado_release=$RELEASE_DIR/eladoingatlan"
            test -d "$RELEASE_DIR/eladoingatlan"
            test -f "$RELEASE_DIR/eladoingatlan/package.json"

            mkdir -p "$SUB_DIR"
            # Forrás sync + törölt fájlok eltüntetése; node_modules/.next külön kezelve
            rsync -avrt --no-g --no-o --exclude 'node_modules' --exclude '.next' "$RELEASE_DIR/eladoingatlan/" "$SUB_DIR/"
            # Poka-Yoke: régi Next build soha ne maradjon
            rm -rf "$SUB_DIR/.next"
            printf '%s\n' "$SHA" > "$SUB_DIR/BUILD_SHA"
            chown -R deploy:deploy "$SUB_DIR"

            cd "$SUB_DIR"
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm run build
            test -d "$SUB_DIR/.next"
            test -f "$SUB_DIR/.next/BUILD_ID" || test -d "$SUB_DIR/.next/server"

            # PM2: tiszta újraindítás az új builddel
            pm2 delete eladoingatlan-szcenario 2>/dev/null || true
            PORT=5140 HOSTNAME=127.0.0.1 pm2 start npm --name eladoingatlan-szcenario --cwd "$SUB_DIR" --update-env -- start
            pm2 save

            sleep 3
            CODE=$(curl -sS -o /tmp/elado-body.html -w '%{http_code}' --max-time 20 http://127.0.0.1:5140/ || echo 000)
            echo "curl_5140=$CODE"
            test "$CODE" = "200"
            grep -qiE 'faház|Börzsöny|Közművek|ivóvíz' /tmp/elado-body.html
            test "$(tr -d '\n' < "$SUB_DIR/BUILD_SHA")" = "$SHA"
            echo "eladoingatlan_ok sha=$SHA"
