name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Node target, port 4100)
        env:
          NODE_ENV: production
        run: npm run build:node

      - name: Verify CI production output
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -d .output/public
          mkdir -p .output/public
          echo "${{ github.sha }}" > .output/public/build-id.txt
          echo "${{ github.sha }}" > BUILD_SHA
          printf '{"sha":"%s","builtAt":"%s"}\n' "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .output/public/version.json
          test -f .output/public/sw.js
          test -f .output/public/manifest.webmanifest
          test -f .output/public/manifest.json
          test -f .output/public/index.html
          test -f .output/public/_shell.html
          test -f scripts/static-origin.mjs
          echo "Built SHA ${{ github.sha }}"
          find .output/public -maxdepth 2 -type f | sort

      - name: Package release
        run: |
          set -euo pipefail
          test -f ecosystem.config.cjs
          test -f scripts/static-origin.mjs
          test -f scripts/vps-activate.sh
          test -f package.json
          test -f BUILD_SHA
          rm -rf release release.tar.gz
          mkdir -p release/scripts
          cp -a .output release/.output
          cp -a package.json package-lock.json ecosystem.config.cjs BUILD_SHA release/
          cp -a scripts/static-origin.mjs scripts/vps-activate.sh release/scripts/
          tar -czf release.tar.gz -C release .
          tar -tzf release.tar.gz | grep -E '^\./ecosystem\.config\.cjs$|^ecosystem\.config\.cjs$'
          tar -tzf release.tar.gz | grep -E 'scripts/vps-activate\.sh'
          tar -tzf release.tar.gz | grep -E '\.output/server/index\.mjs|BUILD_SHA|build-id\.txt|scripts/static-origin\.mjs'
          ls -lh release.tar.gz

      - name: Validate VPS SSH key secret
        run: |
          test -n "${{ secrets.VPS_SSH_KEY }}" || (echo "Missing VPS_SSH_KEY secret" && exit 1)

      - name: Upload release to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 195.228.152.141
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "release.tar.gz"
          target: "/var/www/szcenario/incoming/"
          overwrite: true
          timeout: 120s

      - name: Activate release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 195.228.152.141
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: false
          command_timeout: 10m
          script: |
            set -euo pipefail
            SITE_SLUG=szcenario
            APP_DIR=/var/www/szcenario
            SHA=${{ github.sha }}
            RELEASE_DIR="$APP_DIR/releases/$SHA"
            mkdir -p "$APP_DIR/incoming" "$APP_DIR/releases" "$APP_DIR/shared"
            TAR="$(find "$APP_DIR/incoming" -name 'release.tar.gz' -type f | sort | tail -n 1)"
            test -n "$TAR"
            echo "tar=$TAR"
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"
            tar -xzf "$TAR" -C "$RELEASE_DIR"
            rm -f "$TAR"
            test -f "$RELEASE_DIR/scripts/vps-activate.sh"
            chmod +x "$RELEASE_DIR/scripts/vps-activate.sh"
            SITE_SLUG="$SITE_SLUG" APP_DIR="$APP_DIR" bash "$RELEASE_DIR/scripts/vps-activate.sh" "$SHA"
