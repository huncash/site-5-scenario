name: Restart sites 1-4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restart-sites-1-4.yml"

concurrency:
  group: restart-sites-1-4
  cancel-in-progress: false

jobs:
  diagnose-and-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Diagnose + rebuild/restart site-1..4
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 195.228.152.141
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: false
          command_timeout: 25m
          script: |
            set -uo pipefail
            echo "whoami=$(whoami) host=$(hostname)"
            echo "==== pm2 before ===="
            pm2 status || true
            echo "==== /var/www ===="
            ls -la /var/www || true
            echo "==== listening ===="
            ss -lptn | grep -E ':300[0-3]\b|:5100\b' || true

            for s in 1 2 3 4; do
              APP_DIR="/var/www/site-$s"
              APP_NAME="site-$s"
              echo "========== $APP_NAME =========="
              if [ ! -d "$APP_DIR" ]; then
                echo "MISSING dir $APP_DIR"
                continue
              fi
              cd "$APP_DIR"
              echo "pwd=$(pwd) owner=$(stat -c '%U:%G' .)"
              git remote -v || true
              git fetch origin || true
              git reset --hard "origin/main" || true
              if npm install && rm -rf .next && npm run build; then
                pm2 delete "$APP_NAME" || true
                pm2 start npm --name "$APP_NAME" -- start || true
              else
                echo "BUILD FAILED for $APP_NAME — trying pm2 restart only"
                pm2 restart "$APP_NAME" || pm2 start npm --name "$APP_NAME" -- start || true
              fi
            done

            pm2 save || true
            echo "==== pm2 after ===="
            pm2 status || true
            echo "==== listening after ===="
            ss -lptn | grep -E ':300[0-3]\b|:5100\b' || true
